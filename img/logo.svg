<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2a5e"/>
      <stop offset="100%" stop-color="#1a6ca8"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3368"/>
      <stop offset="100%" stop-color="#0a2a5e"/>
    </linearGradient>
  </defs>

  <!-- Globe grid / compass rose background -->
  <g opacity="0.12">
    <circle cx="100" cy="100" r="85" fill="none" stroke="#1a6ca8" stroke-width="0.5"/>
    <ellipse cx="100" cy="100" rx="85" ry="40" fill="none" stroke="#1a6ca8" stroke-width="0.4"/>
    <line x1="15" y1="100" x2="185" y2="100" stroke="#1a6ca8" stroke-width="0.4"/>
    <line x1="100" y1="15" x2="100" y2="185" stroke="#1a6ca8" stroke-width="0.4"/>
    <line x1="40" y1="60" x2="160" y2="140" stroke="#1a6ca8" stroke-width="0.3"/>
    <line x1="160" y1="60" x2="40" y2="140" stroke="#1a6ca8" stroke-width="0.3"/>
  </g>

  <!-- Curved swoosh -->
  <path d="M 30 120 Q 5 80 50 30 Q 100 -15 160 30 Q 200 60 180 110"
        fill="none" stroke="url(#swooshGrad)" stroke-width="16" stroke-linecap="round"
        opacity="0.85"/>

  <!-- Ship -->
  <g transform="translate(65, 50)">
    <!-- Hull -->
    <path d="M 0 42 L 65 42 L 72 55 L 8 55 Z" fill="url(#shipGrad)"/>
    <!-- Hull bottom curve -->
    <path d="M 0 42 Q 35 48 72 42" fill="none" stroke="#0a2a5e" stroke-width="1.5"/>
    <!-- Superstructure -->
    <rect x="38" y="18" width="24" height="24" rx="2" fill="#0d3368"/>
    <!-- Windows 3x4 grid -->
    <g fill="white" opacity="0.85">
      <rect x="42" y="21" width="4" height="3" rx="0.5"/>
      <rect x="48" y="21" width="4" height="3" rx="0.5"/>
      <rect x="54" y="21" width="4" height="3" rx="0.5"/>
      <rect x="42" y="26" width="4" height="3" rx="0.5"/>
      <rect x="48" y="26" width="4" height="3" rx="0.5"/>
      <rect x="54" y="26" width="4" height="3" rx="0.5"/>
      <rect x="42" y="31" width="4" height="3" rx="0.5"/>
      <rect x="48" y="31" width="4" height="3" rx="0.5"/>
      <rect x="54" y="31" width="4" height="3" rx="0.5"/>
    </g>
    <!-- Funnel -->
    <rect x="45" y="10" width="8" height="10" rx="1" fill="#0a3d70"/>
    <!-- Bow -->
    <path d="M 0 42 L 12 38 L 0 36 Z" fill="#0d3368"/>
    <!-- Water line -->
    <path d="M 0 52 Q 20 49 40 52 Q 55 54 72 52" fill="none" stroke="#1a6ca8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- FLY text -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="42" letter-spacing="8" fill="#0a2a5e">FLY</text>
</svg>
